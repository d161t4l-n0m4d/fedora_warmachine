# Hive SEC WarMachine – tmux multiplex config
# Loaded by: wm-control start

# Prefix: Ctrl-a (easier than Ctrl-b for ops)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of life
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on
set -sg escape-time 0
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar – dark ops style
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1c1c1c,fg=#a8a8a8"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#00ff87,bold,bg=#303030] WM #[fg=#87d7ff,bg=#1c1c1c] #S "
set -g status-right "#[fg=#808080]#{?client_prefix,#[fg=#ffaf00]PREFIX ,}#[fg=#87d7ff]#H #[fg=#808080]| #[fg=#ffd787]%H:%M "
setw -g window-status-format "#[fg=#808080] #I:#W "
setw -g window-status-current-format "#[fg=#1c1c1c,bg=#00ff87,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#00ff87"
set -g pane-border-status top
set -g pane-border-format "#[fg=#87d7ff] #{pane_index} #{pane_title} "

# Activity
setw -g monitor-activity on
set -g visual-activity off

# Keys – splits and navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7

# Quick tools
bind r source-file "#{WORKSPACE}/tmux.warmachine.conf" \; display-message "WarMachine tmux reloaded"
bind m select-window -t 1 \; select-pane -t 1
bind S command-prompt -p "send to all panes:" "run-shell 'tmux list-panes -F \"##{pane_id}\" | xargs -I{} tmux send-keys -t {} \"%1\" Enter'"

# Copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Messages
set -g message-style "bg=#303030,fg=#00ff87"
